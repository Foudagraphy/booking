<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foudagarphy</title>

<style>

/* ================= BACKGROUND FIX ================= */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
              url("bg.jpg") no-repeat center center/cover;
  background-attachment: fixed;
  color: white;
}

.overlay {
  background: rgba(0,0,0,0.4);
  min-height: 100vh;
}

/* ================= ANIMATION ================= */
.fade {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ================= HEADER ================= */
.header {
  text-align: center;
  padding: 30px 15px;
}

.header img { width: 120px; }
.header h1 { color: #ffd700; }

/* ================= GALLERY ================= */
.gallery {
  display: flex;
  gap: 12px;
  padding: 15px;
  overflow-x: auto;
}

.gallery img {
  height: 150px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.07);
}

/* ================= FULLSCREEN ================= */
.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.fullscreen img {
  max-width: 90%;
  max-height: 90%;
}

/* ================= PACKAGES + ADDONS ================= */
.packages {
  text-align: center;
  padding: 20px;
}

h2 { color: #ffd700; }

.package {
  background: #111;
  border: 1px solid #ffd700;
  margin: 12px auto;
  padding: 18px;
  border-radius: 10px;
  max-width: 500px;
  cursor: pointer;
  transition: 0.3s;
}

.package:hover {
  transform: translateY(-5px);
}

.package.active {
  border: 2px solid #ffd700;
  background: #1f1a00;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
}

/* ================= PRICE ================= */
.price {
  font-size: 20px;
  margin-top: 10px;
}

.stars { color: gold; }

/* ================= BOOKING ================= */
.booking {
  text-align: center;
  padding: 20px;
}

input, select {
  width: 90%;
  max-width: 400px;
  padding: 12px;
  margin: 10px auto;
  border-radius: 6px;
  border: none;
  display: block;
}

button {
  background: #ffd700;
  color: black;
  padding: 12px;
  border: none;
  width: 90%;
  max-width: 400px;
  border-radius: 6px;
  cursor: pointer;
}

/* ================= FLOATING ================= */
.whatsapp, .call {
  position: fixed;
  right: 20px;
  border-radius: 50%;
  padding: 14px;
  color: white;
  text-decoration: none;
}

.whatsapp { bottom: 20px; background: #25D366; }
.call { bottom: 80px; background: #007bff; }

.fixed-book {
  position: fixed;
  bottom: 140px;
  right: 20px;
  background: #ffd700;
  color: black;
  padding: 10px 16px;
  border-radius: 25px;
}

/* ================= MOBILE ================= */
@media (max-width:768px){
  .gallery img { height: 120px; }
}

</style>
</head>

<body>

<div class="overlay">

<!-- HEADER -->
<div class="header fade">
  <img src="logo.png">
  <h1>Foudagarphy</h1>
</div>

<!-- GALLERY -->
<div class="gallery fade">
  <img src="1.jpg" onclick="openImage(this.src)">
  <img src="2.jpg" onclick="openImage(this.src)">
  <img src="3.jpg" onclick="openImage(this.src)">
</div>

<div class="fullscreen" id="viewer" onclick="closeImage()">
  <img id="viewerImg">
</div>

<!-- PACKAGES -->
<div class="packages fade">
<h2>الباكيدجات</h2>

<div class="package" onclick="selectPackage('Package 1', this)">
<h3>Package 1</h3>
<div class="price">3000 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 2', this)">
<h3>Package 2</h3>
<div class="price">4000 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 3', this)">
<h3>Package 3</h3>
<div class="price">4500 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 4', this)">
<h3>Package 4</h3>
<div class="price">5000 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 5', this)">
<h3>VIP Package</h3>
<div class="price">6000 LE</div>
</div>

</div>

<!-- ADDONS (MULTI SELECT) -->
<div class="packages fade">
<h2>الإضافات (اختار أكتر من واحدة)</h2>

<div class="package addon" onclick="toggleAddon(this, 'تصوير قاعة / بارتي')">
🎉 تصوير قاعة / بارتي - 1500 LE
</div>

<div class="package addon" onclick="toggleAddon(this, 'تصوير بيت')">
🏠 تصوير في البيت - 1200 LE
</div>

<div class="package addon" onclick="toggleAddon(this, 'فيديو سيشن')">
🎬 فيديو سيشن - 3500 LE
</div>

<div class="package addon" onclick="toggleAddon(this, 'فيديو + قاعة')">
🎬 فيديو + قاعة - 5000 LE
</div>

</div>

<!-- BOOKING -->
<div class="booking fade" id="booking">
<h2>احجز الآن</h2>

<input type="text" id="name" placeholder="اسمك">

<select id="package">
<option>Package 1</option>
<option>Package 2</option>
<option>Package 3</option>
<option>Package 4</option>
<option>Package 5</option>
</select>

<input type="date" id="date">

<button onclick="sendToWhatsApp()">احجز عبر واتساب</button>
</div>

</div>

<!-- FLOATING -->
<a class="whatsapp" href="https://wa.me/201551927206">💬</a>
<a class="call" href="tel:201551927206">📞</a>

<script>

let selectedAddons = [];

/* GALLERY */
function openImage(src){
document.getElementById("viewer").style.display="flex";
document.getElementById("viewerImg").src=src;
}

function closeImage(){
document.getElementById("viewer").style.display="none";
}

/* PACKAGE SELECT */
function selectPackage(name, el){

document.getElementById("package").value = name;

document.querySelectorAll(".package").forEach(p=>{
p.classList.remove("active");
});

el.classList.add("active");

document.getElementById("booking").scrollIntoView({behavior:"smooth"});
}

/* ADDONS MULTI SELECT */
function toggleAddon(el, name){

el.classList.toggle("active");

if(selectedAddons.includes(name)){
selectedAddons = selectedAddons.filter(a => a !== name);
}else{
selectedAddons.push(name);
}

}

/* WHATSAPP */
function sendToWhatsApp(){

let name = document.getElementById("name").value;
let pack = document.getElementById("package").value;
let date = document.getElementById("date").value;

if(!name || !date){
alert("من فضلك أكمل البيانات");
return;
}

if(!confirm("تأكيد الحجز؟")) return;

let addonsText = selectedAddons.length ? selectedAddons.join(" + ") : "لا يوجد إضافات";

let msg = `📸 حجز جديد

👤 ${name}
📦 ${pack}
➕ الإضافات: ${addonsText}
📅 ${date}`;

window.open("https://wa.me/201551927206?text=" + encodeURIComponent(msg));

}

</script>

</body>
</html>
