<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foudagarphy</title>

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
              url("bg.jpg") no-repeat center center/cover;
  background-attachment: fixed;
  color: white;
}

.overlay {
  background: rgba(0,0,0,0.4);
  min-height: 100vh;
}

/* ANIMATION */
.fade {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* HEADER */
.header {
  text-align: center;
  padding: 30px 15px;
}

.header img { width: 120px; }
.header h1 { color: #ffd700; }

/* GALLERY */
.gallery {
  display: flex;
  gap: 12px;
  padding: 15px;
  overflow-x: auto;
}

.gallery img {
  height: 150px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.07);
}

/* FULLSCREEN */
.fullscreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.fullscreen img {
  max-width: 90%;
  max-height: 90%;
}

/* PACKAGES */
.packages {
  text-align: center;
  padding: 20px;
}

.package {
  background: #111;
  border: 1px solid #ffd700;
  margin: 12px auto;
  padding: 18px;
  border-radius: 10px;
  max-width: 500px;
  cursor: pointer;
  transition: 0.3s;
}

.package:hover {
  transform: translateY(-5px);
}

/* highlight */
.package.active {
  border: 2px solid #ffd700;
  background: #1f1a00;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
}

/* ADDONS */
.package.addon.active {
  border: 2px solid #25D366;
  background: #0f1a12;
}

/* TEXT */
.title {
  color: #ffd700;
  font-size: 18px;
  font-weight: bold;
}

.line {
  font-size: 14px;
  line-height: 1.7;
  opacity: 0.9;
}

.price {
  margin-top: 10px;
  font-size: 18px;
}

/* TOTAL */
#totalPrice{
  color:#25D366;
  font-size:22px;
  font-weight:bold;
}

/* BOOKING */
.booking {
  text-align: center;
  padding: 20px;
  scroll-margin-top: 100px;
}

input, select {
  width: 90%;
  max-width: 400px;
  padding: 12px;
  margin: 10px auto;
  border-radius: 6px;
  border: none;
  display: block;
}

button {
  background: #ffd700;
  color: black;
  padding: 12px;
  border: none;
  width: 90%;
  max-width: 400px;
  border-radius: 6px;
  cursor: pointer;
}

/* FLOATING */
.whatsapp, .call {
  position: fixed;
  right: 20px;
  border-radius: 50%;
  padding: 14px;
  color: white;
  text-decoration: none;
  z-index: 9999;
}

.whatsapp { bottom: 20px; background: #25D366; }
.call { bottom: 80px; background: #007bff; }

</style>
</head>

<body>

<div class="overlay">

<!-- HEADER -->
<div class="header fade">
  <img src="logo.png">
  <h1>Foudagarphy</h1>
</div>

<!-- GALLERY -->
<div class="gallery fade">
  <img src="1.jpg" onclick="openImage(this.src)">
  <img src="2.jpg" onclick="openImage(this.src)">
  <img src="3.jpg" onclick="openImage(this.src)">
</div>

<div class="fullscreen" id="viewer" onclick="closeImage()">
  <img id="viewerImg">
</div>

<!-- PACKAGES -->
<div class="packages fade">

<h2>الباكيدجات</h2>

<div class="package" onclick="selectPackage('Package 1', this)">
<div class="title">🌟 Package 1</div>
<div class="line">تصوير السيشن + تابلوه صغير + ١٠ كروت مطبوعة</div>
<div class="price">💰 3000 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 2', this)">
<div class="title">🌟 Package 2</div>
<div class="line">تصوير السيشن + البوم + تابلوه + ١٥ كارت</div>
<div class="price">💰 4000 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 3', this)">
<div class="title">🌟 Package 3</div>
<div class="line">باقة متكاملة</div>
<div class="price">💰 4500 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 4', this)">
<div class="title">🌟 Package 4</div>
<div class="line">باقة كبيرة</div>
<div class="price">💰 5000 LE</div>
</div>

<div class="package" onclick="selectPackage('Package 5', this)">
<div class="title">🌟 Package 5</div>
<div class="line">VIP كاملة</div>
<div class="price">💰 6000 LE</div>
</div>

</div>

<!-- BOOKING -->
<div class="booking fade" id="booking">

<h2>احجز الآن</h2>

<input type="text" id="name" placeholder="اسمك">

<select id="package">
  <option value="">اختار الباكيدج</option>
  <option value="Package 1">Package 1</option>
  <option value="Package 2">Package 2</option>
  <option value="Package 3">Package 3</option>
  <option value="Package 4">Package 4</option>
  <option value="Package 5">Package 5</option>
</select>

<input type="date" id="date">

<h3>الإجمالي: <span id="totalPrice">0</span> LE</h3>

<button onclick="sendToWhatsApp()">احجز عبر واتساب</button>

</div>

</div>

<a class="whatsapp" href="https://wa.me/201551927206">💬</a>
<a class="call" href="tel:201551927206">📞</a>

<script>

let selectedPackage = "";
let selectedPrice = 0;

const packagesPrice = {
"Package 1":3000,
"Package 2":4000,
"Package 3":4500,
"Package 4":5000,
"Package 5":6000
};

function updateTotal(){
document.getElementById("totalPrice").innerText = selectedPrice;
}

function selectPackage(name, el){

selectedPackage = name;
selectedPrice = packagesPrice[name];

document.querySelectorAll(".package").forEach(p=>{
p.classList.remove("active");
});

el.classList.add("active");

/* 🔥 sync with select */
let select = document.getElementById("package");
select.value = name;

/* 🔥 scroll to booking */
document.getElementById("booking").scrollIntoView({behavior:"smooth"});

updateTotal();
}

function openImage(src){
document.getElementById("viewer").style.display="flex";
document.getElementById("viewerImg").src=src;
}

function closeImage(){
document.getElementById("viewer").style.display="none";
}

function sendToWhatsApp(){

let name = document.getElementById("name").value;
let date = document.getElementById("date").value;

if(!name || !date || !selectedPackage){
alert("اكمل البيانات");
return;
}

let total = selectedPrice;

if(!confirm(`تأكيد الحجز بمبلغ ${total} LE؟`)) return;

let msg = `📸 حجز جديد\n\n👤 ${name}\n📦 ${selectedPackage}\n💰 ${total} LE\n📅 ${date}`;

window.open("https://wa.me/201551927206?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
